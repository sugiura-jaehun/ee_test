name: iPhone Safari with Appium XCUITest
on:
  push:
    branches: [ios-appium-video]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android-appium
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ios-appium/package-lock.json
      - name: Install Appium
        run: |
          npm ci --prefix ios-appium
          echo "APPIUM_HOME=$RUNNER_TEMP/appium-home" >> "$GITHUB_ENV"
      - name: Cache the Appium XCUITest driver
        id: driver-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.APPIUM_HOME }}
          key: ios-appium4-xcuitest13.8.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios-appium/package-lock.json') }}
      - name: Install the Appium XCUITest driver
        if: steps.driver-cache.outputs.cache-hit != 'true'
        run: ios-appium/node_modules/.bin/appium driver install xcuitest@13.8.0
      - name: Save the Appium XCUITest driver
        if: steps.driver-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.APPIUM_HOME }}
          key: ${{ steps.driver-cache.outputs.cache-primary-key }}
      - name: Resolve the iPhone 17 simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-26-5"]
          device = next(device for device in devices if device["name"] == "iPhone 17")
          print("SIMULATOR_UDID=" + device["udid"])
          print("SAFARI_HISTORY_DB=" + device["dataPath"] + "/Library/Safari/History.db")
          ' >> "$GITHUB_ENV"
      - name: Restore the standalone FFmpeg package
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-ffmpeg
          key: ios-video-ffmpeg-imageio-0.6.0-${{ runner.os }}-${{ runner.arch }}
      - name: Prepare the standalone FFmpeg package
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: \
            --no-deps --target "$RUNNER_TEMP/ios-ffmpeg" imageio-ffmpeg==0.6.0
      - name: Save the standalone FFmpeg package
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ios-ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Run recorded Safari smoke test
        env:
          SMOKE_START_URL: ${{ secrets.ONCE_SAFARI_START_URL }}
          SMOKE_START_LABEL: ${{ secrets.ONCE_SAFARI_LINK_LABEL }}
          SMOKE_DESTINATION_LABEL: ${{ secrets.ONCE_SAFARI_DESTINATION_LABEL }}
        run: bash ios-appium/run-recorded-smoke.sh
      - name: Upload Safari diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appium-diagnostics
          path: |
            ${{ runner.temp }}/ios-appium-recording/*.log
            ${{ runner.temp }}/ios-appium-recording/*.png
            ${{ runner.temp }}/ios-appium-recording/*.xml
          if-no-files-found: warn
      - name: Compress the screen recording
        if: always()
        timeout-minutes: 4
        run: |
          original="$RUNNER_TEMP/iphone-safari-original.mp4"
          [[ -s "$original" ]] || exit 0
          FFMPEG_BIN=$(PYTHONPATH="$RUNNER_TEMP/ios-ffmpeg" python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          export FFMPEG_BIN
          output="$RUNNER_TEMP/ios-appium-recording/iphone-safari.mp4"
          bash ios-appium/compress-recording.sh "$original" "$RUNNER_TEMP/iphone-safari-compressed.mp4"
          mv "$RUNNER_TEMP/iphone-safari-compressed.mp4" "$output"
      - name: Upload the compressed recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appium-recording
          path: ${{ runner.temp }}/ios-appium-recording/iphone-safari.mp4
          if-no-files-found: warn
