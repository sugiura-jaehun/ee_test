name: Appium version comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  safari:
    name: ${{ matrix.runner }} / Xcode ${{ matrix.xcode }} / iOS ${{ matrix.ios }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: xcuitest-attach
            runner: macos-26
            xcode: "26.2"
            ios: "26.2"
          - mode: xcuitest-attach
            runner: macos-26
            xcode: "26.4.1"
            ios: "26.4"
          - mode: xcuitest-attach
            runner: macos-26-intel
            xcode: "26.2"
            ios: "26.2"
          - mode: xcuitest-attach
            runner: xcode-27
            xcode: "27.2"
            ios: "27.2"
    env:
      APPIUM_MODE: ${{ matrix.mode }}
      SIM_IOS: ${{ matrix.ios }}
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Appium and the selected driver
        run: |
          export APPIUM_HOME="$RUNNER_TEMP/appium-home"
          echo "APPIUM_HOME=$APPIUM_HOME" >> "$GITHUB_ENV"
          npm install --global appium@4.0.1
          if [[ "$APPIUM_MODE" == safari-driver ]]; then
            appium driver install safari@6.0.5
          else
            appium driver install xcuitest@13.8.0
          fi
      - name: Resolve the iPhone 17 on iOS 26.5
        run: |
          uname -m
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          import os
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["SIM_IOS"].replace(".", "-")
          devices = json.load(sys.stdin)["devices"][runtime]
          print(next(device["udid"] for device in devices if device["name"] == "iPhone 17"))
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Tap one link in iPhone Safari through Appium
        run: bash appium/run-smoke.sh
      - name: Print failure diagnostics
        if: failure()
        run: |
          for log in appium.log wda.log; do
            if [[ -f "$log" ]]; then
              echo "Log: $log"
              tail -65 "$log"
            fi
          done
