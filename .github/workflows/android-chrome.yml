name: Android Chrome UI smoke test
on:
  push:
    branches: [android-chrome-video]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Build UI Automator test APKs
        run: gradle -p android assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for the Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run and record the Chrome test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_START_URL: ${{ secrets.ONCE_SAFARI_START_URL }}
          SMOKE_START_LABEL: ${{ secrets.ONCE_SAFARI_LINK_LABEL }}
          SMOKE_DESTINATION_LABEL: ${{ secrets.ONCE_SAFARI_DESTINATION_LABEL }}
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash android/run-recorded-smoke.sh
      - name: Upload the screen recording and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-chrome-recording
          path: ${{ runner.temp }}/android-smoke/
          if-no-files-found: warn
