name: iPhone Safari native UI smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare the test project
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate --spec native/project.yml
      - name: Tap a link on the configured site in iPhone Safari
        env:
          TEST_RUNNER_SMOKE_START_URL: ${{ secrets.ONCE_SAFARI_START_URL }}
          TEST_RUNNER_SMOKE_LINK_LABEL: ${{ secrets.ONCE_SAFARI_LINK_LABEL }}
          TEST_RUNNER_SMOKE_DESTINATION_LABEL: ${{ secrets.ONCE_SAFARI_DESTINATION_LABEL }}
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          : "${TEST_RUNNER_SMOKE_START_URL:?Missing test URL}"
          : "${TEST_RUNNER_SMOKE_LINK_LABEL:?Missing link label}"
          : "${TEST_RUNNER_SMOKE_DESTINATION_LABEL:?Missing destination label}"
          log="$RUNNER_TEMP/live-safari-test.log"
          if xcodebuild test -project native/SafariSmoke.xcodeproj -scheme SafariSmoke \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -parallel-testing-enabled NO \
            -only-testing:SafariTests/SafariTests/testTapLinkOnConfiguredSite -quiet > "$log" 2>&1; then
            echo "PASS: Safari tapped the configured link and displayed the destination."
          else
            rg -o 'Start-page link was unavailable|Destination marker was already visible before the tap|Destination marker was unavailable after the tap|\*\* TEST FAILED \*\*' "$log" || true
            exit 1
          fi
