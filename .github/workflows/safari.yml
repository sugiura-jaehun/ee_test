name: iPhone Safari smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  safari:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Boot an iPhone simulator
        timeout-minutes: 6
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-27-2"]
          print(next(device["udid"] for device in devices if device["name"] == "iPhone 17"))
          ')
          time xcrun simctl bootstatus "$udid" -b
      - name: Click a link in iPhone Safari
        timeout-minutes: 4
        run: |
          /usr/bin/safaridriver --version
          xcrun simctl list devices booted
          sudo /usr/bin/safaridriver --enable
          time python3 safari_smoke.py
