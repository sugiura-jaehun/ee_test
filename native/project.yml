name: SafariSmoke
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.safarismoke
  SafariTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Host
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.safarismoke.tests
schemes:
  SafariSmoke:
    build:
      targets:
        Host: all
        SafariTests: [test]
    test:
      targets: [SafariTests]
